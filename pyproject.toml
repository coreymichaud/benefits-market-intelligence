[project]
name = "benefits-market-intelligence"
version = "0.1.0"
description = "Analysis of Form 5500 filings to surface employer benefits trends and market insights for benefits brokers."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.5",
    "jupyter>=1.1.1",
    "kaleido>=1.4.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
# Pinned so a ruff upgrade can't change what CI enforces
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source_pkgs = ["benefits_market_intelligence"]

[tool.coverage.report]
fail_under = 100
